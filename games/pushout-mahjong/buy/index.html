<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Buy Pushout Mahjong | KokokAyam</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #111827;
            color: white;

            min-height: 100vh;

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 30px;
        }

        .product {
            width: 100%;
            max-width: 600px;

            background: #1e293b;

            border: 1px solid #334155;
            border-radius: 16px;

            padding: 45px 35px;

            text-align: center;

            box-shadow: 0 20px 50px rgba(0,0,0,0.35);
        }

        .logo {
            font-size: 18px;
            font-weight: bold;

            margin-bottom: 35px;
        }

        .logo span {
            color: #facc15;
        }

        h1 {
            font-size: 38px;
            margin-bottom: 15px;
        }

        .description {
            color: #94a3b8;
            font-size: 17px;
            line-height: 1.7;

            margin-bottom: 30px;
        }

        .price {
            font-size: 38px;
            font-weight: bold;

            color: #facc15;

            margin-bottom: 30px;
        }

        .buy-button {
            display: inline-block;

            width: 100%;

            padding: 16px;

            background: #facc15;
            color: #111827;

            text-decoration: none;

            border-radius: 8px;

            font-weight: bold;
            font-size: 17px;

            margin-bottom: 15px;
        }

        .buy-button:hover {
            background: #fde047;
        }

        .back-button {
            display: inline-block;

            color: #94a3b8;

            text-decoration: none;

            font-size: 14px;
        }

        .back-button:hover {
            color: white;
        }
    </style>
</head>

<body>

    <div class="product">

        <div class="logo">
            Kokok<span>Ayam</span>
        </div>

        <h1>
            Pushout Mahjong
        </h1>

        <p class="description">
            Game Mahjong strategi HTML5 yang dapat dimainkan
            langsung melalui browser.
        </p>

        <div class="price">
            Rp300.000
        </div>

        <a
            href="#"
            class="buy-button"
        >
            BELI SEKARANG
        </a>

        <a
            href="../../../"
            class="back-button"
        >
            ← Kembali ke KokokAyam Games
        </a>

    </div>

</body>
</html>
