<!DOCTYPE html>
<html lang="id">
<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Payment Successful - Pushout Mahjong</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;

    display: flex;
    justify-content: center;
    align-items: center;

    font-family: Arial, Helvetica, sans-serif;

    background:
        linear-gradient(
            135deg,
            #111827,
            #1e293b,
            #0f172a
        );

    color: white;
}

.card {

    width: 90%;
    max-width: 520px;

    padding: 40px 25px;

    text-align: center;

    border-radius: 20px;

    background:
        rgba(255,255,255,0.08);

    border:
        1px solid
        rgba(255,255,255,0.15);

    box-shadow:
        0 20px 50px
        rgba(0,0,0,0.35);
}

.success {

    width: 80px;
    height: 80px;

    margin:
        0 auto 25px;

    display: flex;
    align-items: center;
    justify-content: center;

    border-radius: 50%;

    background: #22c55e;

    font-size: 45px;
    font-weight: bold;
}

h1 {

    margin:
        0 0 15px;

    font-size: 30px;
}

.game {

    font-size: 22px;

    font-weight: bold;

    margin:
        25px 0;
}

.message {

    color: #cbd5e1;

    line-height: 1.6;
}

.download {

    display: block;

    margin-top: 30px;

    padding: 16px;

    border-radius: 12px;

    background: #22c55e;

    color: white;

    text-decoration: none;

    font-size: 18px;

    font-weight: bold;
}

.download:hover {

    opacity: 0.9;
}

.warning {

    margin-top: 20px;

    color: #94a3b8;

    font-size: 13px;

    line-height: 1.5;
}

.back {

    display: inline-block;

    margin-top: 20px;

    color: #94a3b8;

    text-decoration: none;

}

</style>

</head>

<body>

<div class="card">

    <div class="success">
        ✓
    </div>

    <h1>
        Pembayaran Berhasil
    </h1>

    <div class="message">

        Terima kasih telah membeli
        game kami.

        <br><br>

        Pesanan kamu untuk:

    </div>

    <div class="game">
        Pushout Mahjong
    </div>

    <div class="message">

        Pembayaran telah berhasil
        diproses.

    </div>

    <!--
    ============================================================
    DOWNLOAD
    ============================================================

    JANGAN masukkan link game asli dulu.

    Kita akan menghubungkan tombol ini
    dengan sistem verifikasi pembayaran
    setelahnya.
    -->

    <a
        href="#"
        class="download"
        onclick="return false;"
    >
        DOWNLOAD GAME
    </a>

    <div class="warning">

        Download akan tersedia setelah
        sistem memverifikasi pembayaran.

    </div>

    <a
        href="./"
        class="back"
    >
        ← Kembali ke halaman pembelian
    </a>

</div>

</body>
</html>
